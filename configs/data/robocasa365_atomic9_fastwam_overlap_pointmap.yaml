# Atomic9 PointMap-Aux数据合同；任务、自然采样与global stats与Atomic9 RGB-D完全一致。
format: robocasa365_lerobot_v21
training_ready: true
multitask_manifest: logs/cluster/robocasa365_atomic9_fastwam_overlap_manifest.json
expected_task_count: 9
expected_sampling: natural_proportional
task_manifest: configs/tasks/robocasa365_atomic9_fastwam_overlap.json
statistics_path: logs/cluster/robocasa365_atomic9_fastwam_overlap_global_stats.json
camera_keys:
  - observation.images.robot0_agentview_left
  - observation.images.robot0_agentview_right
  - observation.images.robot0_eye_in_hand
camera_types:
  - static
  - static
  - dynamic
sequence_length: 9
frame_skip: 4
action_skip: 1
video_size: [256, 320]
augment: true
crop_ratio: 0.95
brightness: 0.2
contrast: 0.2
saturation: 0.2
hue: 0.05
normalization: panda_omron_v1
schema_path: configs/schemas/robocasa365_panda_omron_v1.json
pointmap_cache_root: ./datasets/robocasa365/pointmap-cache/atomic9
pointmap_cache_manifest: ./datasets/robocasa365/pointmap-cache/atomic9-manifest.json
pointmap_cache_audit: ./datasets/robocasa365/pointmap-cache/atomic9-audit.json
parquet_cache_size: 2
video_cache_size: 4
pointmap_cache_size: 12
