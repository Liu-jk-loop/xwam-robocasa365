# Clariden M6正式配置门禁：完整scheduler，先到step 2，再严格恢复到step 4。
exp_root: ./experiments/
exp_name: robocasa365_m6_gh200_gate
seed: 42

lr: 1e-5
weight_decay: 0.01
num_warmup_steps: 200
num_train_epochs: 5
num_training_steps: auto
trainer_max_steps: 2
gradient_clip_val: 1.0
gradient_clip_algorithm: norm

clean_action_ratio: 0.5
text_dropout_prob: 0.1
train_subset_size: null
train_subset_start: 0
train_shuffle: true
persist_generator_state: true

enable_tensorboard: false
enable_checkpointing: true
save_interval: 2
save_top_k: -1
save_last: link
save_on_exception: false
save_final_checkpoint: false
resume_checkpoint: null
log_interval: 1
val_interval: 2
limit_val_batches: 0
