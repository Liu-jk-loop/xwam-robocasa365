# Clariden 4xGH200：训练到 step 2 保存，再从同一 checkpoint 恢复到 step 4。
exp_root: ./experiments/
exp_name: clariden_close_fridge_4gpu_resume_gate
seed: 42

lr: 1e-5
weight_decay: 0.01
num_warmup_steps: 0
num_training_steps: 4
trainer_max_steps: 2
gradient_clip_val: 1.0
gradient_clip_algorithm: norm

# 每个 rank 每个 epoch 获得两个固定 clip；两阶段保持完全相同的数据合同。
train_subset_size: 8
train_subset_start: 0
train_shuffle: false
persist_generator_state: true
clean_action_ratio: 0.0
text_dropout_prob: 0.0

enable_tensorboard: false
enable_checkpointing: true
save_interval: 2
save_top_k: -1
save_last: link
save_on_exception: false
save_final_checkpoint: false
resume_checkpoint: null
log_interval: 1
val_interval: 2
limit_val_batches: 0
