# CloseFridge A组：保留X-WAM原始clean-action混合比例。
exp_root: ./experiments/
exp_name: close_fridge_rgb_ratio05_seed42_4gpu
seed: 42

lr: 1e-5
weight_decay: 0.01
num_warmup_steps: 200
num_training_steps: 3000
trainer_max_steps: 1000
gradient_clip_val: 1.0
gradient_clip_algorithm: norm

clean_action_ratio: 0.5
text_dropout_prob: 0.1
train_subset_size: null
train_subset_start: 0
train_shuffle: true
persist_generator_state: true

enable_tensorboard: false
enable_wandb: true
wandb_project: xwam-robocasa365
wandb_entity: null
wandb_name: close_fridge_rgb_ratio05_seed42_4gpu
wandb_group: close_fridge_clean_action_ab_seed42
wandb_mode: online
wandb_require_api_key: true
wandb_log_model: false

enable_checkpointing: true
checkpoint_dir: null
save_interval: 250
save_top_k: 5
save_last: link
save_on_exception: false
durable_checkpoint_dir: null
final_checkpoint_dir: null
save_final_checkpoint: true
resume_checkpoint: null

log_interval: 20
val_interval: 1000
limit_val_batches: 0
