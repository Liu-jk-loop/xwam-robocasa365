# Clariden M6正式主实验：Atomic-Seen同名18任务、RGB-only、自然样本比例、5 epochs。
exp_root: ./experiments/
exp_name: robocasa365_m6_atomic_seen18_rgb_seed42
seed: 42

lr: 1e-5
weight_decay: 0.01
num_warmup_steps: 200
num_train_epochs: 5
num_training_steps: auto
trainer_max_steps: null
gradient_clip_val: 1.0
gradient_clip_algorithm: norm

clean_action_ratio: 0.5
text_dropout_prob: 0.1
train_subset_size: null
train_subset_start: 0
train_shuffle: true
persist_generator_state: true

enable_tensorboard: false
enable_wandb: true
wandb_project: xwam-robocasa365
wandb_entity: null
wandb_name: robocasa365_m6_atomic_seen18_rgb_seed42
wandb_group: robocasa365_m6_atomic_seen18
wandb_mode: online
wandb_log_model: false
enable_checkpointing: true
save_interval: 1000
save_top_k: 2
save_last: link
save_on_exception: false
save_final_checkpoint: true
resume_checkpoint: null
log_interval: 20
val_interval: 1000
limit_val_batches: 0
