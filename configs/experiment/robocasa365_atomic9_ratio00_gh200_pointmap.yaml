# Atomic9 PointMap-Aux 14000-step实验：除辅助模态外与Atomic9 RGB-D完全一致。
exp_root: ./experiments/
exp_name: robocasa365_atomic9_fastwam_overlap_ratio00_pointmap_seed42_8gpu
seed: 42

lr: 1e-5
weight_decay: 0.01
num_warmup_steps: 200
num_train_epochs: 8
# 8 epoch仅用于preflight折算；正式停止点与RGB-D相同，固定14000步。
num_training_steps: 14000
formal_fixed_training_steps: 14000
trainer_max_steps: null
gradient_clip_val: 1.0
gradient_clip_algorithm: norm

clean_action_ratio: 0.0
text_dropout_prob: 0.1
train_subset_size: null
train_subset_start: 0
train_shuffle: true
persist_generator_state: true

enable_tensorboard: false
enable_wandb: true
wandb_project: xwam-robocasa365
wandb_entity: null
wandb_name: robocasa365_atomic9_fastwam_overlap_ratio00_pointmap_seed42_8gpu
wandb_group: robocasa365_atomic9_fastwam_overlap_pointmap
wandb_mode: online
wandb_require_api_key: true
wandb_log_model: false
enable_checkpointing: true
checkpoint_dir: null
save_interval: 500
save_top_k: 5
save_last: link
save_on_exception: false
durable_checkpoint_dir: null
durable_save_interval: 3000
durable_save_top_k: -1
durable_save_last: false
milestone_checkpoint_dir: null
milestone_checkpoint_interval: null
milestone_checkpoint_filename: epoch5-{step}
final_checkpoint_dir: null
save_final_checkpoint: true
resume_checkpoint: null
log_interval: 20
val_interval: 1000
limit_val_batches: 0
