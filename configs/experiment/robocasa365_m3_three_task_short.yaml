# M3.2：三个 atomic 任务按固定 round-robin 各训练 4 个 step。
exp_root: ./experiments/
exp_name: robocasa365_m3_three_task_short
seed: 42

lr: 1e-5
weight_decay: 0.01
num_warmup_steps: 0
num_training_steps: 12
trainer_max_steps: 12
accumulate_grad_batches: 1
gradient_clip_val: 1.0
gradient_clip_algorithm: norm

# 保持原 X-WAM 训练分布，不再使用 clean_action_ratio=0 诊断。
clean_action_ratio: 0.5
text_dropout_prob: 0.0
train_subset_size: null
train_subset_start: 0
train_shuffle: false
persist_generator_state: false

# checkpoint/resume 已在 M3.1 验证；本轮只隔离多任务训练链路和 FP32 state。
enable_tensorboard: false
enable_checkpointing: false
save_interval: 12
save_top_k: 0
save_last: false
save_on_exception: false
resume_checkpoint: null
log_interval: 1
val_interval: 12
limit_val_batches: 0
