# M3.2：固定一个 CloseFridge clip，使用 FP32 optimizer state 验证 RGB-only 过拟合曲线。
# 这是数值诊断配置，不是正式训练配置。
exp_root: ./experiments/
exp_name: close_fridge_m3_overfit_curve
seed: 42

# optimizer / scheduler
lr: 1e-5
weight_decay: 0.01
num_warmup_steps: 0
num_training_steps: 50
trainer_max_steps: 50
accumulate_grad_batches: 1
gradient_clip_val: 1.0
gradient_clip_algorithm: norm

# deterministic single-clip diagnostic
train_subset_size: 1
train_subset_start: 0
train_shuffle: false
persist_generator_state: false
text_dropout_prob: 0.0

# 每一步都监督 action/proprio，避免 batch size 1 时 50% step 显示为零。
# M3.3 多任务短训练和正式训练必须恢复模型层默认值 0.5。
clean_action_ratio: 0.0

# FP32 CPUAdam 的训练内存已通过；关闭保存以避开 120 GiB 主机的 checkpoint 峰值。
log_interval: 1
enable_tensorboard: false
enable_checkpointing: false
save_interval: 50
save_top_k: 0
save_last: false
save_on_exception: false
resume_checkpoint: null

val_interval: 50
limit_val_batches: 0
