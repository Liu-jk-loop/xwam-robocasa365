# CloseFridge单任务RGB-D正式训练：ratio0、固定3000步scheduler和停止点。
exp_root: ./experiments/
exp_name: close_fridge_rgbd_ratio00_seed42_8gpu
seed: 42

lr: 1e-5
weight_decay: 0.01
num_warmup_steps: 200
num_training_steps: 3000
trainer_max_steps: 3000
gradient_clip_val: 1.0
gradient_clip_algorithm: norm

clean_action_ratio: 0.0
text_dropout_prob: 0.1
train_subset_size: null
train_subset_start: 0
train_shuffle: true
persist_generator_state: true

enable_tensorboard: false
enable_wandb: true
wandb_project: xwam-robocasa365
wandb_entity: null
wandb_name: close_fridge_rgbd_ratio00_seed42_8gpu
wandb_group: close_fridge_rgbd_seed42
wandb_mode: online
wandb_require_api_key: true
wandb_log_model: false

enable_checkpointing: true
checkpoint_dir: null
save_interval: 500
save_top_k: 2
save_last: link
save_on_exception: false
checkpoint_post_save_barrier: true
durable_checkpoint_dir: null
durable_save_interval: 1000
durable_save_top_k: -1
durable_save_last: false
final_checkpoint_dir: null
save_final_checkpoint: true
resume_checkpoint: null

log_interval: 20
val_interval: 1000
limit_val_batches: 0
